{% extends "layout.html" %}

{% block title %}: Reset password{% endblock %}

{% block main %}
<div class="card narrow">
    <h1>Reset password</h1>
    <form action="/reset" method="post">
        {% if question %}
            <input type="hidden" name="username" value="{{ username }}">
            <p><strong>{{ question }}</strong></p>
            <label>Answer <input name="answer" autofocus required></label>
            <label>New password <input name="password" type="password" autocomplete="new-password" required></label>
            <label>Confirm new password <input name="confirmation" type="password" autocomplete="new-password" required></label>
            <button class="btn">Reset password</button>
        {% else %}
            <label>Username <input name="username" autofocus required></label>
            <button class="btn">Continue</button>
        {% endif %}
    </form>
    <p class="small"><a href="/login">Back to log in</a></p>
</div>
{% endblock %}
