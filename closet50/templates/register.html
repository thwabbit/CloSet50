{% extends "layout.html" %}

{% block title %}: Sign up{% endblock %}

{% block main %}
<div class="card narrow">
    <h1>Create your closet</h1>
    <form action="/register" method="post">
        <label>Username <input name="username" autocomplete="username" autofocus required></label>
        <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
        <label>Confirm password <input name="confirmation" type="password" autocomplete="new-password" required></label>
        <label>Security question (used to reset your password)
            <select name="question" required>
                <option>What was the name of your first pet?</option>
                <option>What city were you born in?</option>
                <option>What was your favorite childhood book?</option>
                <option>What street did you grow up on?</option>
            </select>
        </label>
        <label>Answer <input name="answer" required></label>
        <button class="btn">Sign up</button>
    </form>
    <p class="small">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
