<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloSet50{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <a href="/" class="brand">CloSet<span>50</span></a>
        {% if session["user_id"] %}
            <div class="nav-links">
                <a href="/">Closet</a>
                <a href="/upload">Add item</a>
                <a href="/generate">Generate</a>
                <a href="/build">Build</a>
                <a href="/outfits">Outfits</a>
                <a href="/logout" class="muted">Log out</a>
            </div>
        {% else %}
            <div class="nav-links">
                <a href="/login">Log in</a>
                <a href="/register">Sign up</a>
            </div>
        {% endif %}
    </nav>

    <main>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block main %}{% endblock %}
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
